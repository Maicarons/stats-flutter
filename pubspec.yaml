name: stats_flutter
description: "Stats-flutter — 移动优先的工程化统计分析套件，含学习与测试模块。"
publish_to: 'none'
version: 1.3.1+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.0
  intl: any
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  share_plus: ^10.1.3
  fl_chart: ^0.69.2
  uuid: ^4.5.1
  statkit:
    path: packages/statkit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/data/

  # 本地打包字体：拉丁/数字用 Inter，避免 google_fonts 运行时下载。
  # 中文由系统字体回退（PingFang SC / 微软雅黑 / Noto Sans CJK），
  # 这样既没有首屏 FOUT，也不必打包 ~17MB 全量中文字体。
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color: "#2F6FED"
  adaptive_icon_background: "#2F6FED"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
