name: stats_flutter
description: "Stats-flutter — 移动优先的统计分析套件，灵感来自 GNU PSPP，含学习与测试模块。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.0
  intl: any
  csv: ^6.0.0
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  share_plus: ^10.1.3
  fl_chart: ^0.69.2
  uuid: ^4.5.1
  statkit:
    path: packages/statkit
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color: "#2F6FED"
  adaptive_icon_background: "#2F6FED"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
