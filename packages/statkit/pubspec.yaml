name: statkit
description: >-
  Pure Dart statistics kernel: descriptives, hypothesis tests (t, ANOVA,
  chi-square), correlation, regression, nonparametric tests, reliability,
  clustering, ROC, PCA and logistic regression. Zero Flutter dependency.
version: 0.4.0
homepage: https://maicarons.github.io/stats-flutter/
repository: https://github.com/Maicarons/stats-flutter/tree/main/packages/statkit
issue_tracker: https://github.com/Maicarons/stats-flutter/issues
documentation: https://maicarons.github.io/stats-flutter/api/statkit

license: AGPL-3.0

topics:
  - statistics
  - statistics-analysis
  - math
  - data-science
  - hypothesis-testing

environment:
  sdk: ^3.5.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
