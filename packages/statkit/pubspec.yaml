name: statkit
description: >-
  Pure Dart statistics kernel: descriptives, t/ANOVA/ANCOVA, correlation,
  regression, nonparametric tests, reliability, clustering, PCA, ROC and
  logistic regression.
version: 0.6.0
homepage: https://maicarons.github.io/stats-flutter/
repository: https://github.com/Maicarons/stats-flutter/tree/main/packages/statkit
issue_tracker: https://github.com/Maicarons/stats-flutter/issues
documentation: https://maicarons.github.io/stats-flutter/api/statkit

license: AGPL-3.0

topics:
  - statistics
  - statistics-analysis
  - math
  - data-science
  - hypothesis-testing

environment:
  sdk: ^3.5.0

dependencies:
  # 仅用于 @experimental 标注（标出 v0.5 新增、签名可能在小版本内调整的入口）。
  # 上界开在 1.x 内：flutter_test 会按 SDK 精确钉住某个 1.x 版本。
  meta: '>=1.17.0 <2.0.0'

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
