name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  statkit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/statkit
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test

  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
