# Build release artifacts and attach them to GitHub Release.

name: Build release artifacts

on:
  push:
    tags:
      - 'app-v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux
        run: |
          cd build/linux/x64/release/bundle
          tar czf ../../../../stats-flutter-linux-x64.tar.gz .
          ls -lah ../../../../stats-flutter-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/stats-flutter-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath build\stats-flutter-windows-x64.zip -Force
          Get-Item build\stats-flutter-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/stats-flutter-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          echo "Packing $APP"
          cd build/macos/Build/Products/Release
          zip -ryq ../../../../../stats-flutter-macos.zip "$(basename "$APP")"
          ls -lah ../../../../../stats-flutter-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/stats-flutter-macos.zip

  attach-release:
    needs: [build-web, build-android, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          mkdir -p out
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) -exec cp {} out/ \;
          if [ -d dist/web ]; then
            (cd dist/web && zip -qr "$GITHUB_WORKSPACE/out/stats-flutter-web.zip" .)
          fi
          ls -lah out
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
