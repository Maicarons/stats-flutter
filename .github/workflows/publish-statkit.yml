# Auto-publish statkit to pub.dev when a new version is tagged/released.
#
# Triggers:
#   - git tag  statkit-vX.Y.Z  or  vX.Y.Z  (with packages/statkit/pubspec.yaml version match)
#   - GitHub Release published
#   - workflow_dispatch (manual, optional version override)
#
# One-time setup on https://pub.dev/packages/statkit/admin :
#   Enable "Automated publishing from GitHub Actions"
#   Repository: Maicarons/stats-flutter
#   Required tag pattern: e.g. "statkit-v" (recommended)
#
# Alternative (if OIDC is not enabled): set repository secret PUB_CREDENTIALS
# from the JSON written by `dart pub token add https://pub.dev` / credentials.json.

name: Publish statkit to pub.dev

on:
  push:
    tags:
      - 'statkit-v*'
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if version already exists on pub.dev'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write # required for pub.dev OIDC automated publishing

defaults:
  run:
    working-directory: packages/statkit

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Read package version
        id: meta
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          NAME=$(grep -E '^name:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Package $NAME $VER"

      - name: Check tag matches pubspec (when tagged)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Tag: $TAG"
          # accept v1.2.3 or statkit-v1.2.3
          TAG_VER="${TAG#statkit-}"
          TAG_VER="${TAG_VER#v}"
          PKG_VER="${{ steps.meta.outputs.version }}"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag version ($TAG_VER) != pubspec version ($PKG_VER)"
            exit 1
          fi

      - name: Install & test
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Dry-run publish
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        # Use OIDC (preferred). Falls back to PUB_CREDENTIALS if configured.
        run: dart pub publish --force
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
